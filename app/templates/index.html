<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 720px;">

    <div id="loginView">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title mb-4">AI Task Manager</h3>
          <div id="loginError" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="username" class="form-control" value="admin">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" value="password123">
          </div>
          <button onclick="login()" class="btn btn-primary w-100">Sign in</button>
        </div>
      </div>
    </div>

    <div id="appView" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">AI Task Manager</h3>
        <div>
          <span id="userBadge" class="badge bg-secondary me-2"></span>
          <button onclick="logout()" class="btn btn-outline-secondary btn-sm">Logout</button>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form onsubmit="createTask(event)">
            <div class="input-group">
              <input id="taskTitle" class="form-control" placeholder="New task..." required>
              <button class="btn btn-primary" type="submit">Add</button>
            </div>
          </form>
        </div>
      </div>

      <div id="taskList" class="list-group shadow-sm"></div>

      <div id="emptyState" class="text-center text-muted py-5 d-none">
        <p class="fs-5 mb-1">No tasks yet</p>
        <p class="small">Create one above to get started.</p>
      </div>
    </div>

  </div>

  <script>
    async function api(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function showLoginError(msg) {
      const el = document.getElementById("loginError");
      el.textContent = msg;
      el.classList.remove("d-none");
    }

    async function login() {
      document.getElementById("loginError").classList.add("d-none");
      try {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        await api("POST", "/login", { username: user, password: pass });
        document.getElementById("loginView").classList.add("d-none");
        document.getElementById("appView").classList.remove("d-none");
        loadApp();
      } catch (e) {
        showLoginError(e.message);
      }
    }

    async function logout() {
      await api("POST", "/logout");
      document.getElementById("appView").classList.add("d-none");
      document.getElementById("loginView").classList.remove("d-none");
    }

    async function loadApp() {
      try {
        const profile = await api("GET", "/profile");
        document.getElementById("userBadge").textContent = profile.username;
      } catch (_) {}
      loadTasks();
    }

    async function loadTasks() {
      try {
        const tasks = await api("GET", "/tasks");
        const container = document.getElementById("taskList");
        const empty = document.getElementById("emptyState");
        container.innerHTML = "";
        if (tasks.length === 0) {
          empty.classList.remove("d-none");
          return;
        }
        empty.classList.add("d-none");
        tasks.forEach(t => {
          const div = document.createElement("div");
          div.className = "list-group-item d-flex align-items-center gap-2";
          div.innerHTML = `
            <input type="checkbox" class="form-check-input mt-0" ${t.completed ? "checked" : ""} onchange="toggleTask(${t.id}, this.checked)">
            <span class="${t.completed ? "text-decoration-line-through text-muted" : ""} flex-grow-1">${esc(t.title)}</span>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${t.id})">Delete</button>
          `;
          container.appendChild(div);
        });
      } catch (_) {}
    }

    async function createTask(e) {
      e.preventDefault();
      const input = document.getElementById("taskTitle");
      const title = input.value.trim();
      if (!title) return;
      try {
        await api("POST", "/tasks", { title });
        input.value = "";
        loadTasks();
      } catch (_) {}
    }

    async function toggleTask(id, completed) {
      await api("PUT", "/tasks/" + id, { completed });
      loadTasks();
    }

    async function deleteTask(id) {
      await api("DELETE", "/tasks/" + id);
      loadTasks();
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    if (window.location.pathname === "/") login();
  </script>
</body>
</html>
